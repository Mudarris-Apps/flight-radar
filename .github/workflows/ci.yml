name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the metadata table is the committed stub
        run: |
          if ! grep -q 'const size_t METADATA_COUNT = 0;' flight_radar/src/metadata_table.cpp; then
            echo "::error file=flight_radar/src/metadata_table.cpp::metadata_table.cpp must be the empty stub; the generated table is OpenSky-derived data and must not be committed"
            exit 1
          fi
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang make
      - name: Download ArduinoJson 7.4.3
        run: curl -fsSL https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.3.tar.gz | tar xz -C "$RUNNER_TEMP"
      - name: Run host tests
        run: make -C tests CXX=clang++ ARDUINOJSON_DIR="$RUNNER_TEMP/ArduinoJson-7.4.3/src"

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .'
